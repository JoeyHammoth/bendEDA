name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile the package
        run: python -m compileall -q bendeda
      - name: Install the package (exercises the PEP 517 backend)
        # The harness image no longer runs pip — an offline build cannot fetch a
        # build backend — so the backend is checked here instead.
        run: python -m pip install --no-deps -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python -m bendeda --version
          python -m bendeda --help
      - name: Schema and task-package validation
        run: python -m bendeda validate --all
      - name: Sealed-oracle dry run writes nothing
        # The commitment has to be recomputable without a key, so the dry run is
        # the cheapest evidence that the archive is deterministic and the root
        # is printed rather than stored.
        run: |
          mkdir -p .bend-cache/oracle-demo
          printf 'example component\n' > .bend-cache/oracle-demo/a.txt
          python -m bendeda oracle seal .bend-cache/oracle-demo --dry-run --out .bend-cache/sealed
          test ! -e .bend-cache/sealed
      - name: Law lint refuses the seeded defects
        # The defective fixture seeds one defect per rule, so the expected exit is
        # 1. A linter that silently stopped firing would exit 0 here and fail.
        run: |
          set +e
          python -m bendeda law lint tests/fixtures/law_packages/defective \
            --mutation tests/fixtures/law_packages/defective/mutation.json --quiet
          rc=$?
          set -e
          test "$rc" -eq 1

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Secret scan
        run: python tools/check_secrets.py .
      - name: Licence headers
        run: python tools/check_license_headers.py .
      - name: Whitespace and newline endings
        run: python tools/check_whitespace.py .
      - name: No plaintext oracle in history
        run: python tools/check_oracle_absence.py .
      - name: DCO sign-off on every commit in the pull request
        if: github.event_name == 'pull_request'
        run: python tools/check_dco.py "origin/${{ github.base_ref }}"

  locked-files:
    name: locked-file guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fail on any change to a locked artifact without the amendment label
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python tools/check_locked.py --base "origin/${{ github.base_ref }}" --labels "$PR_LABELS"

  docs:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Site integrity (assets exist, links resolve)
        run: python tools/check_site.py site

  vector-path:
    name: L1 vector path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - name: Fetch the pinned compiler sources and verify digests
        run: python tools/fetch_bend.py
      - name: Comparator unit tests (no compiler needed)
        run: python -m unittest tests.test_vector_path.TestComparator -v
      - name: BendBV proofs check, and the unmasked control is refused
        env:
          BENDEDA_BUN: bun
          BENDEDA_BEND_CLI: .bend-cache/bend-2.0.40/bend2/main.ts
        run: python -m unittest tests.test_bv -v

      - name: Proof cookbook examples check under the pin
        # The `tests` job has no compiler, so this is where the cookbook's nine
        # files and its one deliberate counterexample are actually run.
        env:
          BENDEDA_BUN: bun
          BENDEDA_BEND_CLI: .bend-cache/bend-2.0.40/bend2/main.ts
        run: python -m unittest tests.test_cookbook -v

      - name: Checker canary suite (pinned sources under Bun)
        env:
          BENDEDA_BUN: bun
          BENDEDA_BEND_CLI: .bend-cache/bend-2.0.40/bend2/main.ts
        run: python -m bendeda canary --local --out .bend-cache/canary-local.json

      - name: Model mutation kills what the law claims (LA3)
        env:
          BENDEDA_BUN: bun
          BENDEDA_BEND_CLI: .bend-cache/bend-2.0.40/bend2/main.ts
        run: |
          python -m bendeda law mutate tests/fixtures/law_packages/toy_mutation \
            --local --min-mutants 2 --min-kill 0.5 --max-mutants 8 \
            --out .bend-cache/mutate-toy.json

      - name: Compile the fixture, trace it, and detect an injected offset
        env:
          BENDEDA_BUN: bun
          BENDEDA_BEND_CLI: .bend-cache/bend-2.0.40/bend2/main.ts
        run: |
          python -m bendeda conformance compile \
            --model experiments/fixtures/toy_counter/model.bend \
            --out .bend-cache/out/model.mjs
          python -m bendeda conformance trace --module .bend-cache/out/model.mjs --cycles 24
          python -m bendeda conformance trace --module .bend-cache/out/model.mjs --cycles 24 --inject-offset 1
          python -m unittest tests.test_vector_path -v

  bend-image:
    name: bend image (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage the release archive the build will use
        run: |
          name=bend-2.0.40-linux-x64.tar.gz
          curl -fsSL -o "docker/archives/$name" \
            "https://github.com/bendlang/bend/releases/download/v2.0.40/$name"
          echo "c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b  docker/archives/$name" | sha256sum -c -
      - name: Build the image from the pinned archive digest, with no network
        # The archive is staged, so the build has no HTTP client at all and
        # `--network=none` is a real constraint rather than a claim.
        run: |
          docker pull debian:bookworm-slim
          docker build --network=none -f docker/Dockerfile.bend -t bendeda/bend:2.0.40 .
      - name: The image reports its own version
        run: docker run --rm bendeda/bend:2.0.40 version
      - name: The released binary compiles the fixture
        run: |
          # `.bend-cache/` is gitignored, so a fresh checkout has no output
          # directory. Run as the runner's uid too: the image's `bend` user has
          # no claim on the mounted workspace.
          mkdir -p .bend-cache/out
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" -w /work bendeda/bend:2.0.40 \
            experiments/fixtures/toy_counter/model.bend -o .bend-cache/out/model.mjs
          test -s .bend-cache/out/model.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: The binary's module passes the same trace gate as the source build
        run: |
          node tools/model_vectors.mjs .bend-cache/out/model.mjs experiments/fixtures/toy_counter/plan.json \
            | head -20

      - name: The released binary accepts the BendBV proofs
        run: |
          out=$(docker run --rm -v "$PWD:/work" -w /work bendeda/bend:2.0.40 bv/bv.bend 2>&1)
          echo "$out"
          echo "$out" | grep -q "ALL PROOFS CHECK"

      - name: The released binary refuses the unmasked control
        # Bend writes failures to stderr, so both streams are captured; the gate
        # reads the verdict text as well as the exit status, because the verdict
        # is what the proof discipline actually promises.
        run: |
          set +e
          out=$(docker run --rm -v "$PWD:/work" -w /work bendeda/bend:2.0.40 bv/negative/unmasked_add.bend 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q "SOME PROOFS FAIL"
          if echo "$out" | grep -q "ALL PROOFS CHECK"; then
            echo "the unmasked control was accepted"
            exit 1
          fi

      - name: Checker canary suite (released binary in the pinned image)
        # Same 35 controls as vector-path, through the artefact a result would
        # actually cite. The suite writes its .bend files on the host and the
        # image reads them from the mounted workspace.
        run: |
          mkdir -p .bend-cache/canary
          python -m bendeda canary --image pinned --out .bend-cache/canary-image.json

      - name: Model mutation through the released binary (LA3)
        run: |
          python -m bendeda law mutate tests/fixtures/law_packages/toy_mutation \
            --image pinned --min-mutants 2 --min-kill 0.5 --max-mutants 8

      - name: Record whether --verdict works at the pinned release
        # G-02: the proven-kernel checker is what A5 and D5 assumed. This step
        # must not fail the build when the kernel is absent — that absence is the
        # finding, and it is written into the report rather than hidden.
        run: |
          set +e
          python -m bendeda canary --image pinned --verdict --only a01 \
            --out .bend-cache/canary-verdict.json
          echo "verdict probe exit: $?"
          set -e

  harness-image:
    name: harness image (pinned Dockerfile)
    # Phase 0 exit criterion 1 says three images build. Bend and OSS CAD Suite
    # each have a job; this is the harness, which had never been built anywhere.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Pull the base images the offline build is allowed to assume
        run: |
          docker pull python:3.12-slim-bookworm
          docker pull node:20-bookworm-slim
      - name: Build the harness image with no network
        # Criterion 1 of issue #6: the build must not need a route off the
        # machine. A networked build here would hide exactly the failure this
        # change removed (apt-get, then pip fetching a build backend).
        run: docker build --network=none -f docker/Dockerfile.harness -t bendeda/harness:0.0.1 .
      - name: The CLI answers inside the image
        run: |
          docker run --rm bendeda/harness:0.0.1 --version
          docker run --rm bendeda/harness:0.0.1 validate --all

  bend-and-eda:
    name: bend and EDA gates
    # Runs only once the tools runner exists. Set the repository variable
    # BENDEDA_TOOLS_RUNNER=true after registering it (issue #12). Until then the
    # job is skipped, which is honest: a gate that cannot run must not report a
    # pass, and it must not sit queued forever pretending it will.
    if: vars.BENDEDA_TOOLS_RUNNER == 'true'
    runs-on: [self-hosted, linux, bendeda-tools]
    steps:
      - uses: actions/checkout@v7
      - name: Law lint, model mutation, canary suite, translation fidelity
        run: |
          bendeda canary --image pinned
          bendeda law lint tasks --recursive
          bendeda tf run --all

  # The full agent run matrix is never run in CI: it is expensive, stochastic and
  # needs local models. It runs on the study host and publishes bundles as release
  # assets. Recorded here so the absence is a decision, not an oversight.
