# B1 FIFO: authoring chain (Appendix J.4).
#
# This is a DRAFT chain and it says so. One Freebuff session wrote the model,
# laws, abstraction map, locked SVA, reference proofs and the C2 pack. Role
# labels record which artifact belongs to which role; they do not record
# independence, because there was none. The policy proxy that must log forbidden
# reads does not exist yet (Phase 2), so `forbidden_reads_attested` is an
# attestation by the author, not evidence, and `review.independence` is absent
# rather than filled with a number nobody measured.
#
# `locked.by: unlocked` is a placeholder that keeps the sidecar schema-shaped
# without claiming a Conductor signed anything.
